<section><app-titulo-pages [tituloInicial]="tituloInicial" /></section>
<section class="container py-5">
    <h2 class="cliente-texto">Algunos de nuestros clientes</h2>
    <div class="row">
        <div class="col-12 col-sm-6 col-md-4 col-lg-3 d-flex justify-content-center align-items-center border-img" *ngFor="let cliente of clientes">
            <img class="img-fluid cliente-img" src="images/clientes/{{cliente.src}}" alt="{{cliente.title}}">
        </div>
    </div>
</section>
