<div id="carouselInicio" class="carousel slide" data-bs-ride="carousel">
    <div class="carousel-indicators">
        <button *ngFor="let slide of slides; let i = index" type="button" [attr.data-bs-target]="'#carouselInicio'"
            [attr.data-bs-slide-to]="i" [class.active]="i === 0" [attr.aria-current]="i === 0 ? 'true' : null"
            [attr.aria-label]="'Slide ' + (i + 1)"></button>
    </div>
    <div class="carousel-inner carousal-container">
        <div *ngFor="let slide of slides; let i = index" [ngClass]="{'active': i === 0}" class="carousel-item">
            <img src="images/carousel/{{ slide.src }}" alt="{{ slide.title }}" class="d-block w-100 img-fluid"
                loading="lazy" />
        </div>
    </div>
    <button class="carousel-control-prev" type="button" data-bs-target="#carouselInicio" data-bs-slide="prev">
        <span class="carousel-control-prev-icon" aria-hidden="true"></span>
        <span class="visually-hidden">Previous</span>
    </button>
    <button class="carousel-control-next" type="button" data-bs-target="#carouselInicio" data-bs-slide="next">
        <span class="carousel-control-next-icon" aria-hidden="true"></span>
        <span class="visually-hidden">Next</span>
    </button>
</div>
